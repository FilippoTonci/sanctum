name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check committed OpenAPI spec matches source
        # The `sanctum-desktop` repo builds its TypeScript client from the
        # committed schema/openapi.json. If the generator and the committed
        # file disagree, the desktop's types would silently drift. Fail the
        # PR so the author has to regenerate + commit in the same change.
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- schema/openapi.json || {
            echo "::error::schema/openapi.json is stale — run 'python scripts/generate_openapi.py' and commit the result"
            exit 1
          }

      - name: Contract-compat check vs main (informational during beta)
        # Reports breaking changes to the API contract (removed route,
        # removed schema, removed property, newly-required request field).
        # `sanctum-desktop` pins a specific sanctum commit, so a break
        # eventually means the desktop pin moves in lockstep — but until
        # `sanctum-desktop` cuts its first tagged 0.0.1 release the
        # contract is still settling and the WS-by-WS rhythm produces
        # several deliberate breaks. `continue-on-error: true` keeps the
        # signal visible in the PR's checks tab without blocking merge.
        # Re-promote to a hard gate (delete `continue-on-error`) at the
        # first sanctum-desktop tagged release. Skipped when the PR's
        # base already IS main (nothing to diff).
        if: github.event_name == 'pull_request' && github.base_ref != ''
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git show "origin/${{ github.base_ref }}:schema/openapi.json" > /tmp/baseline-openapi.json || {
            echo "baseline spec missing on ${{ github.base_ref }} — skipping compat check"
            exit 0
          }
          python scripts/check_api_compat.py --base /tmp/baseline-openapi.json --current schema/openapi.json

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Cache spaCy model
        id: spacy-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/spacy-models
          key: spacy-en_core_web_sm-${{ matrix.python-version }}-v1

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest -m "not evaluation"

      - name: Enforce coverage gates
        run: |
          python -m coverage report \
            --include="sanctum/core/*,sanctum/documents/*,sanctum/security/*" \
            --fail-under=85
          python -m coverage report --fail-under=70

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
