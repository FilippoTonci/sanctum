[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum"
version = "0.1.0"
description = "Local-first document anonymization for professionals"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "faker>=20.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "detect-secrets>=1.4",
]
# Document-adapter runtime deps (WS2). Reportlab + pypdf live here so the
# fixture-generator script and PDF derivative-writer can produce PDFs.
documents = [
    "python-docx>=0.8.11",
    "openpyxl>=3.1",
    "pdfplumber>=0.9",
    "python-pptx>=0.6.21",
    "pypdf>=4.0",
    "reportlab>=4.0",
]
# Mapping-store runtime deps (WS3). cryptography provides ChaCha20-Poly1305
# AEAD; argon2-cffi provides the Argon2id passphrase KDF.
security = [
    "cryptography>=42",
    "argon2-cffi>=23",
]
# Localhost API runtime deps (WS4). Flask for the app framework; waitress is
# the production WSGI runner (Windows-friendly, pure-python, no libuv dep).
api = [
    "flask>=3",
    "waitress>=3",
]
ci = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "detect-secrets>=1.4",
    # Document-adapter deps are required at test-collection time: the
    # office-fixture determinism test imports the generator script, which
    # imports python-docx/openpyxl/python-pptx/reportlab.
    "sanctum[documents]",
    # Security deps pulled in so mapping-store tests run under the gate.
    "sanctum[security]",
    # API deps pulled in so route tests run under the gate.
    "sanctum[api]",
]

[project.scripts]
sanctum = "sanctum.cli.commands:cli"

[tool.setuptools.packages.find]
include = ["sanctum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--cov=sanctum",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "evaluation: marks tests as evaluation scoring (deselect with '-m \"not evaluation\"')",
    "integration: marks tests as integration tests requiring real Presidio engines",
]

[tool.coverage.run]
branch = true
source = ["sanctum"]
omit = [
    "sanctum/__main__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff]
src = ["sanctum"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ANN",   # flake8-annotations
]
ignore = [
    "ANN401",  # any-type (allowed in adapters with opaque metadata)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B011"]
"scripts/**" = ["ANN"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Strict on the domain — Protocols and compliance invariants live here.
[[tool.mypy.overrides]]
module = "sanctum.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# Third-party libraries without type stubs.
[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "faker.*",
    "pdfplumber.*",
    "openpyxl.*",
    "docx.*",
    "pptx.*",
    "reportlab.*",
    "spacy.*",
    "argon2.*",
    "cryptography.*",
    "waitress.*",
]
ignore_missing_imports = true

# Tests run under lenient defaults.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
