[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum"
version = "0.1.0"
description = "Local-first document anonymization for professionals"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "faker>=20.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "ruff>=0.1",
    "mypy>=1.5",
]
docs = [
    "python-docx>=0.8.11",
    "openpyxl>=3.1",
    "pdfplumber>=0.9",
]

[project.scripts]
sanctum = "sanctum.cli.commands:cli"

[tool.setuptools.packages.find]
include = ["sanctum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "evaluation: marks tests as evaluation scoring (deselect with '-m \"not evaluation\"')",
    "integration: marks tests as integration tests requiring real Presidio engines",
]

[tool.ruff]
src = ["sanctum"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
